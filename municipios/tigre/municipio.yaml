# Scouting Tigre — se superpone a config.yaml (ver src/config.py). Datos generados por tools/municipio_pba.py.
# Normativa: UrbaSIG de la Provincia (Código de Zonificación Ord. 1894/96 y modif. hasta 3776/21; capa 09-2022).
# Decisiones tomadas sin Gonzalo (13-14/11/2026); umbrales de Gonzalo del 14/11. Ver municipios/tigre/NORMATIVA.md.

municipio:
  nombre: Tigre
  motor: zonas
  en_prueba: true                  # mail marcado [EN PRUEBA], solo a mail.para (o la primera dirección de MAIL_TO)

criterio:                          # Gonzalo, 14/11/2026: más bajos que San Isidro (400/500) porque Tigre vende más barato
  m2_construibles_min: 1300
  incidencia_max_usd: 350
  incidencia_casi_max_usd: 450

productos:
  normativa_csv: municipios/tigre/normativa_zonas.csv
  alias_zonas!: {}
  multifamiliar_sup_min:           # planillas de tigre.gob.ar (Gonzalo, 19/11/2026: valen sobre el Decreto 165/08)
    R4: 1000                       # multifamiliar en terrenos de 1.000 m² o más
    R1u: 600                       # multifamiliar en terrenos de 600 m² o más, 1 vivienda cada 300 m² (Ord. 3749/20)
  m2_por_habitante: 30             # Gonzalo, 19/11/2026: la densidad limita los m² (2 personas por dormitorio, art. 13)
  premio_ley_8912:                 # Gonzalo, 14/11/2026: usar los premios del Art. 47 cuando sea factible aplicarlos
    parcelas_min: 2                # lote de al menos 2 parcelas mínimas (y 2 frentes mínimos si se conoce el frente)
  comparables:
    busquedas_mercadolibre:
      - https://inmuebles.mercadolibre.com.ar/terrenos-lotes/venta/bsas-gba-norte/tigre/_TOTAL*AREA_150-400
    busquedas_zonaprop: []
  flags:
    calles_via_rapida: []          # el incentivo de vías rápidas es del C.O.U. de San Isidro
    articulos!:                    # cada flag con la norma de Tigre (las de San Isidro no aplican)
      galpon_no_conforme: "uso no conforme: verificar Código de Zonificación de Tigre"
      pasivo_ambiental: "verificar antecedentes del predio"
      gran_predio_3000: "predio grande: verificar cesiones Ley 8912"
      manzana_7400: "posible manzana completa: verificar Ley 8912"
      ue_10000: "más de 1 ha: verificar urbanización/club de campo Ley 8912"
      frentista_via_rapida: ""
      lindero_zona_c_o_i: "lindero a zona comercial o industrial"
      borde_de_zona: "posible predio en dos zonas: verificar plano"
      requiere_cloaca_para_max: "multifamiliar solo con agua y cloaca (observación de la zona)"
      premio_ley_8912: "la zona tiene premios del Art. 47 Ley 8912: ver notas de la zona"
      premio_ley_8912_aplicado: "FOT con premios máximos del Art. 47 Ley 8912 (ancho de parcela, perímetro libre, retiros): verificar"
      ver_observacion_zona: "la zona tiene observaciones en UrbaSIG: ver normativa_zonas.csv"
      dos_frentes: "esquina o doble frente: más frente a la calle que el informado"
      proyecto_aprobado_previo: "Ord. 4448/26 art. 17.1: un expediente anterior al 05/11/2025 o una factibilidad otorgada conservan la norma anterior (más altura): verificar"
    patrones_texto:                # Gonzalo, 19/11/2026: señal a partir del texto del aviso
      proyecto_aprobado_previo: "proyecto aprobado|planos? (municipales )?aprobados?|(pre)?factibilidad|permiso de obra|proyecto con aprobaci|aprobaci[oó]n municipal"

zonificacion:
  zonas_geojson: municipios/tigre/zonas.geojson
  barrios_geojson: municipios/tigre/localidades.geojson
  calles_geojson: municipios/tigre/calles.geojson
  fot_max: 3.75                    # C2a, C2b, TC con premios (FOT residencial 2,5 de las planillas)
  superficie_min_prefiltro: 346.7  # = 1300 / 3.75
  # Ord. 4448/26 (alturas por sector): municipios/tigre/alturas_4448.yaml, polígonos de tools/alturas_4448.py
  alturas_yaml: municipios/tigre/alturas_4448.yaml
  alturas_geojson: municipios/tigre/alturas_4448.geojson

portales:
  zonaprop:
    # Tigre tiene miles de lotes en barrios cerrados (sin producto): los terrenos arrancan en 600 m2 para no
    # multiplicar páginas. Sin probar todavía: primera consulta después de la corrida de San Isidro del 16/11.
    start_urls:
      - https://www.zonaprop.com.ar/terrenos-venta-tigre-mas-600-m2.html
      - https://www.zonaprop.com.ar/casas-venta-tigre-mas-600-m2.html
      - https://www.zonaprop.com.ar/bodegas-galpones-venta-tigre-mas-400-m2.html
      - https://www.zonaprop.com.ar/edificios-venta-tigre.html
  mercadolibre:
    busquedas:
      - url: https://inmuebles.mercadolibre.com.ar/terrenos-lotes/venta/bsas-gba-norte/tigre/_TOTAL*AREA_600-*
        tipologia: terreno
      - url: https://inmuebles.mercadolibre.com.ar/casas/venta/bsas-gba-norte/tigre/_TOTAL*AREA_600-*
        tipologia: casa
      - url: https://inmuebles.mercadolibre.com.ar/depositos-y-galpones/venta/bsas-gba-norte/tigre/_TOTAL*AREA_400-*
        tipologia: galpon

sheet:
  id: ""                           # sin Sheet propia todavía: corre con --sin-sheet

mail:
  asunto: "Scouting Tigre — {n} oportunidades nuevas ({fecha})"

geocodificacion:
  sufijo_direccion: ", Tigre, Buenos Aires, Argentina"
  alias_barrios!:
    villa la nata: Benavídez
    pacheco: General Pacheco
    talar de pacheco: El Talar
    santa maria de tigre: Tigre
    tigre centro: Tigre
    delta: Primera Sección
