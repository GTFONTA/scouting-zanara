# Ordenanza 4448/26 de Tigre (promulgada el 05/05/2026, Boletín Oficial 1065): límites de altura por sector,
# arts. 2 a 11. Transcripción a mano del texto (prevalece sobre la cartografía, art. 1).
# Gonzalo, 19/11/2026: cargar los sectores calle por calle. tools/alturas_4448.py arma los polígonos con las calles,
# ríos y vías de OpenStreetMap y escribe alturas_4448.geojson; el motor usa ese archivo.
#
#   zona       designación de UrbaSIG a la que se aplica (R4 bis / R4 ter / R5 bis son sectores de R4 / R5)
#   pb         N de "PB + N"
#   tipo       frentista: parcelas frentistas a `calle` entre `desde` y `hasta` (sin límites: toda la calle en la
#                         localidad)
#              area:      polígono cerrado por `limites`
#              manual:    límites por nomenclatura catastral u otros que no se pueden armar con OSM; el motor usa
#                         la altura máxima de la zona en la localidad (no pierde oportunidades) y lo avisa
#   sin_multifamiliar  la ordenanza prohíbe edificios multifamiliares de media o alta densidad en el sector
#   condiciones        exigencias del sector (art. 12): se informan como flag
# Nombres: los de la ordenanza, simplificados para que coincidan con OSM ("ffcc mitre", "tren de la costa",
# "rio tigre", "rio reconquista", "canal central", etc.).

